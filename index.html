<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Tic-Tac-Toe — Improved</title>
<style>
body { background: #111; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; font-family: monospace; }
canvas { border: 6px solid #444; image-rendering: pixelated; box-shadow: 0 0 30px #0f08; }
</style>
</head>
<body>
<canvas id="game" width="360" height="420"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const size = 120;
let board = Array(9).fill(null);
let turn = 'X';
let winner = null;
let winLine = null;

function draw() {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0,0,360,420);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Turn: ' + turn, 180, 30);

  ctx.strokeStyle = '#555';
  ctx.lineWidth = 6;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(i*size, 50); ctx.lineTo(i*size, 410); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 50 + i*size); ctx.lineTo(360, 50 + i*size); ctx.stroke();
  }

  board.forEach((cell, i) => {
    if (!cell) return;
    const x = (i % 3) * size + size/2;
    const y = 50 + Math.floor(i / 3) * size + size/2;
    ctx.fillStyle = cell === 'X' ? '#0f0' : '#f44';
    ctx.font = 'bold 70px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cell, x, y);
  });

  if (winLine) {
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 8;
    const [a,b,c] = winLine;
    const x1 = (a%3)*size + size/2;
    const y1 = 50 + Math.floor(a/3)*size + size/2;
    const x2 = (c%3)*size + size/2;
    const y2 = 50 + Math.floor(c/3)*size + size/2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  if (winner) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,360,420);
    ctx.fillStyle = winner === 'draw' ? '#ff0' : '#0f0';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(winner === 'draw' ? 'DRAW!' : winner + ' WINS!', 180, 180);
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText('Click to restart', 180, 230);
  }
}

function checkWin() {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for (let line of lines) {
    const [a,b,c] = line;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      winLine = line;
      return board[a];
    }
  }
  if (board.every(c => c)) return 'draw';
  return null;
}

function reset() {
  board = Array(9).fill(null);
  turn = 'X';
  winner = null;
  winLine = null;
  draw();
}

canvas.addEventListener('click', e => {
  if (winner) { reset(); return; }
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / size);
  const y = Math.floor((e.clientY - rect.top - 50) / size);
  const i = y * 3 + x;
  if (i < 0 || i > 8 || board[i]) return;
  board[i] = turn;
  turn = turn === 'X' ? 'O' : 'X';
  winner = checkWin();
  draw();
});

draw();
</script>
</body>
</html>
